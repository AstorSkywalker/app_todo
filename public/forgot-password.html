<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contrasena | TODOs</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-showcase" aria-label="Recuperacion de cuenta">
        <div class="brand-mark">T</div>
        <div>
          <p class="eyebrow">Seguridad de cuenta</p>
          <h1>TODOs</h1>
          <p class="login-copy">Recibe un enlace temporal para crear una nueva contrasena.</p>
        </div>
      </section>

      <section class="login-panel" aria-label="Formulario de recuperacion">
        <div class="login-card">
          <div class="login-header">
            <p class="eyebrow">Recuperacion</p>
            <h2>Olvide mi contrasena</h2>
            <p>Escribe tu correo y revisa tu bandeja de entrada.</p>
          </div>
          <form class="login-form" id="forgotPasswordForm" action="/api/auth/forgot-password" method="post">
            <label>
              Correo electronico
              <input id="forgotEmail" type="email" autocomplete="email" required>
            </label>
            <button class="primary-button login-submit" type="submit">Enviar enlace</button>
            <p class="login-alert" id="forgotAlert" role="status" aria-live="polite"></p>
            <a href="/login.html">Volver al inicio de sesion</a>
          </form>
        </div>
      </section>
    </main>
    <script src="/forgot-password.js"></script>
  </body>
</html>
