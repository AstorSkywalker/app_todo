<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva contrasena | TODOs</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-showcase" aria-label="Nueva contrasena">
        <div class="brand-mark">T</div>
        <div>
          <p class="eyebrow">Seguridad de cuenta</p>
          <h1>TODOs</h1>
          <p class="login-copy">Crea una contrasena nueva para volver a tus tareas.</p>
        </div>
      </section>

      <section class="login-panel" aria-label="Formulario de nueva contrasena">
        <div class="login-card">
          <div class="login-header">
            <p class="eyebrow">Restablecimiento</p>
            <h2>Nueva contrasena</h2>
            <p>Usa al menos 8 caracteres.</p>
          </div>
          <form class="login-form" id="resetPasswordForm" action="/api/auth/reset-password" method="post">
            <label>
              Nueva contrasena
              <input id="resetPassword" type="password" autocomplete="new-password" minlength="8" required>
            </label>
            <label>
              Repite la contrasena
              <input id="resetPasswordConfirmation" type="password" autocomplete="new-password" minlength="8" required>
            </label>
            <button class="primary-button login-submit" type="submit">Guardar contrasena</button>
            <p class="login-alert" id="resetAlert" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>
    <script src="/reset-password.js"></script>
  </body>
</html>
