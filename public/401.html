<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sesion requerida | TODOs</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-showcase" aria-label="Acceso protegido">
        <div class="brand-mark">T</div>
        <div>
          <p class="eyebrow">Acceso protegido</p>
          <h1>TODOs</h1>
          <p class="login-copy">Esta area requiere una sesion autenticada para proteger tus tareas.</p>
        </div>
      </section>

      <section class="login-panel" aria-label="Sesion requerida">
        <div class="login-card">
          <div class="login-header">
            <p class="eyebrow">Error 401</p>
            <h2>Sesion requerida</h2>
            <p>No tienes un token valido para acceder a este recurso.</p>
          </div>
          <a class="primary-button login-submit" href="/login.html">Iniciar sesion</a>
        </div>
      </section>
    </main>
  </body>
</html>
